<!doctype html>
<html>
  <head>
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no" />
    <meta charset="utf-8" />
    <title>Mapa - Rota Inteligente</title>
    <style>
      html, body, #map { height: 100%; margin: 0; padding: 0; }
      body {
        font-family: Arial, sans-serif;
        background: #f3f4f6;
      }
      .map-error {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        color: #7f1d1d;
        background: linear-gradient(135deg, #fee2e2, #fff7ed);
        border: 1px solid #fca5a5;
        box-sizing: border-box;
      }
    </style>
    <script>
      // The Maps JS API script will be injected by the host when a key is available.
      // Host should postMessage { action: 'loadKey', key: 'RESTRICTED_KEY' } to load the script.
      function loadMapsScript(key) {
        if (!key) {
          const mapHost = document.getElementById('map');
          if (mapHost) {
            mapHost.innerHTML = '<div class="map-error">Google Maps não está configurado. Defina GOOGLE_MAPS_RESTRICTED_KEY ou GOOGLE_MAPS_API_KEY no arquivo .env do backend.</div>';
          }
          return;
        }
        const s = document.createElement('script');
        s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&libraries=places,geometry`;
        s.defer = true;
        s.onload = () => { if (window.init) window.init(); };
        s.onerror = () => {
          const mapHost = document.getElementById('map');
          if (mapHost) {
            mapHost.innerHTML = '<div class="map-error">Não foi possível carregar o Google Maps. Verifique a chave e as permissões da API no Google Cloud.</div>';
          }
        };
        document.head.appendChild(s);
      }
      window.INITIAL_MARKERS = window.INITIAL_MARKERS || [];
      // store markers and polylines for later clearing
      window._mapMarkers = [];
      window._mapPolylines = [];

      function clearMap() {
        window._mapMarkers.forEach(m => m.setMap(null));
        window._mapMarkers = [];
        window._mapPolylines.forEach(p => p.setMap(null));
        window._mapPolylines = [];
      }

      window.addEventListener('message', (ev) => {
        try {
          const payload = typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data;
          if (payload.action === 'loadKey') loadMapsScript(payload.key);
          if (payload.action === 'clear') clearMap();
          if (payload.action === 'center' && payload.lat && payload.lng && window.map) {
            window.map.setCenter({ lat: payload.lat, lng: payload.lng });
            if (payload.zoom) window.map.setZoom(payload.zoom);
          }
        } catch(e) { console.error(e); }
      }, false);
    </script>
    <script>
      // optional initial markers can be injected by setting window.INITIAL_MARKERS before load
      window.INITIAL_MARKERS = window.INITIAL_MARKERS || [];
    </script>
  </head>
  <body>
    <div id="map"></div>
    <script>
      let map;
      function init() {
        const center = { lat: -23.55052, lng: -46.633308 };
        map = new google.maps.Map(document.getElementById('map'), { center, zoom: 12 });
        if (Array.isArray(window.INITIAL_MARKERS) && window.INITIAL_MARKERS.length) {
          window.INITIAL_MARKERS.forEach(m => addMarker(m.lat, m.lng, m.title));
        }
      }
      function addMarker(lat, lng, title) {
        const marker = new google.maps.Marker({ position: { lat, lng }, map, title });
        window._mapMarkers.push(marker);
        return marker;
      }
      function drawPolyline(encoded) {
        try {
          const path = google.maps.geometry.encoding.decodePath(encoded);
          const poly = new google.maps.Polyline({ path, strokeColor: '#1976D2', strokeOpacity: 0.9, strokeWeight: 5 });
          poly.setMap(map);
          window._mapPolylines.push(poly);
          const bounds = new google.maps.LatLngBounds();
          path.forEach(p => bounds.extend(p));
          map.fitBounds(bounds);
        } catch(e) { console.error('drawPolyline', e); }
      }
      window.addEventListener('message', (ev) => {
        try {
          const payload = typeof ev.data === 'string'? JSON.parse(ev.data) : ev.data;
          if (payload.action === 'init') init();
          if (payload.action === 'markers') {
            payload.markers.forEach(m => addMarker(m.lat, m.lng, m.title));
          }
          if (payload.action === 'polyline') drawPolyline(payload.encoded);
        } catch(e) { console.error(e); }
      }, false);
      window.onload = init;
    </script>
  </body>
</html>
