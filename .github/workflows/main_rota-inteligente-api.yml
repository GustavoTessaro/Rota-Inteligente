name: Deploy Rota Inteligente API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PYTHON_VERSION: "3.14"
  BACKEND_DIR: backend-api
  ARTIFACT_NAME: rota-inteligente-api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Build backend-only package
        shell: bash
        run: |
          set -euo pipefail
          package_dir="${RUNNER_TEMP}/rota-inteligente-api"
          rm -rf "$package_dir"
          mkdir -p "$package_dir"
          cp -a "${BACKEND_DIR}/." "$package_dir/"

          rm -rf \
            "$package_dir/.env" \
            "$package_dir/secrets" \
            "$package_dir/.venv" \
            "$package_dir/__pycache__" \
            "$package_dir/.pytest_cache"
          find "$package_dir" -type d -name '__pycache__' -prune -exec rm -rf {} +
          find "$package_dir" -type d -name '.pytest_cache' -prune -exec rm -rf {} +
          find "$package_dir" -type f \( \
            -name '*.db' -o \
            -name '*.pyc' -o \
            -name '*.json' -o \
            -name '.env' -o \
            -name '.env.*' \
          \) -delete

          test -f "$package_dir/app/main.py"
          test -f "$package_dir/requirements.txt"
          test -f "$package_dir/alembic.ini"
          test -d "$package_dir/migrations"
          ! find "$package_dir" -type f \( -name '.env' -o -name '*.db' -o -name '*.json' \) | grep -q .

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/rota-inteligente-api
          if-no-files-found: error
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://rota-inteligente-api.azurewebsites.net
    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/rota-inteligente-api

      - name: Validate downloaded package layout
        shell: bash
        run: |
          set -euo pipefail
          package_dir="${RUNNER_TEMP}/rota-inteligente-api"
          test -f "$package_dir/app/main.py"
          test -f "$package_dir/requirements.txt"
          test -f "$package_dir/alembic.ini"
          test -d "$package_dir/migrations"
          test ! -d "$package_dir/backend-api"
          ! find "$package_dir" -type f \( -name '.env' -o -name '*.db' -o -name '*.json' \) | grep -q .

      - name: Azure login with OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_ECF419DA505B41C78A9BCA73A8538300 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_46E96C4B9EAE4C9FBE8E656F19E58AB1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E4CFFA582901472C95073C73DAB6C37F }}

      - name: Deploy backend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: rota-inteligente-api
          package: ${{ runner.temp }}/rota-inteligente-api
