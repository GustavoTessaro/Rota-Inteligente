name: Build and deploy Python app to Azure Web App - rota-inteligente-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install backend dependencies
        working-directory: backend-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare backend deployment package
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_DIR="${{ runner.temp }}/rota-inteligente-api"
          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR"

          cp -a backend-api/. "$PACKAGE_DIR/"

          rm -rf \
            "$PACKAGE_DIR/.venv" \
            "$PACKAGE_DIR/venv" \
            "$PACKAGE_DIR/secrets" \
            "$PACKAGE_DIR/__pycache__"

          find "$PACKAGE_DIR" -type d -name "__pycache__" -prune -exec rm -rf {} +
          find "$PACKAGE_DIR" -type f -name "*.pyc" -delete
          find "$PACKAGE_DIR" -type f -name "*.pyo" -delete
          find "$PACKAGE_DIR" -type f -name ".env" -delete
          find "$PACKAGE_DIR" -type f -name ".env.*" -delete
          find "$PACKAGE_DIR" -type f -name "*.db" -delete
          find "$PACKAGE_DIR" -type f -name "*.sqlite" -delete
          find "$PACKAGE_DIR" -type f -name "*.sqlite3" -delete
          find "$PACKAGE_DIR" -type f -name "*.json" -delete

          test -f "$PACKAGE_DIR/app/main.py"
          test -f "$PACKAGE_DIR/requirements.txt"
          test -f "$PACKAGE_DIR/alembic.ini"
          test -d "$PACKAGE_DIR/migrations"

          if [ -d "$PACKAGE_DIR/backend-api" ]; then
            echo "ERRO: backend-api apareceu como pasta pai dentro do pacote."
            exit 1
          fi

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: ${{ runner.temp }}/rota-inteligente-api
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: ${{ runner.temp }}/rota-inteligente-api

      - name: Validate downloaded package layout
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_DIR="${{ runner.temp }}/rota-inteligente-api"

          test -f "$PACKAGE_DIR/app/main.py"
          test -f "$PACKAGE_DIR/requirements.txt"
          test -f "$PACKAGE_DIR/alembic.ini"
          test -d "$PACKAGE_DIR/migrations"

          if [ -d "$PACKAGE_DIR/backend-api" ]; then
            echo "ERRO: pacote contém backend-api como diretório pai."
            exit 1
          fi

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_ECF419DA505B41C78A9BCA73A8538300 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_46E96C4B9EAE4C9FBE8E656F19E58AB1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E4CFFA582901472C95073C73DAB6C37F }}

      - name: Deploy backend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: rota-inteligente-api
          package: ${{ runner.temp }}/rota-inteligente-api